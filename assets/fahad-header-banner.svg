<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050a0f"/>
      <stop offset="0.5" stop-color="#0a1a2e"/>
      <stop offset="1" stop-color="#0d1f35"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="880" height="200" fill="url(#bg)"/>

  <!-- guide lines -->
  <line x1="0" y1="34" x2="880" y2="34" stroke="#152238" stroke-width="1"/>
  <line x1="0" y1="166" x2="880" y2="166" stroke="#152238" stroke-width="1"/>
  <line x1="440" y1="34" x2="440" y2="166" stroke="#152238" stroke-width="1" stroke-dasharray="2 6"/>

  <!-- meta labels -->
  <text x="24" y="23" class="mono" font-size="10" fill="#6b7785" letter-spacing="1">&#x2387; main</text>
  <text x="24" y="182" class="mono" font-size="10" fill="#6b7785" letter-spacing="1">fahad://ai.engineer</text>
  <text x="844" y="182" text-anchor="end" class="mono" font-size="10" fill="#6b7785" letter-spacing="1">DHAKA, BD</text>

  <!-- name -->
  <text x="24" y="92" font-size="34" font-weight="600" fill="#eaf2fb" letter-spacing="0.5">Md. Musa Islam Fahad</text>
  <text x="24" y="118" font-size="13" fill="#00c8ff" letter-spacing="3">AI ENGINEER &#183; FLYRANK AI INTERN</text>
  <text x="24" y="142" class="mono" font-size="11" fill="#7d8590" letter-spacing="1">LLMs &#183; RAG Systems &#183; Computer Vision &#183; Time Series</text>

  <!-- data/model flow line -->
  <line x1="470" y1="150" x2="830" y2="150" stroke="#152238" stroke-width="1"/>
  <circle cx="470" cy="150" r="3" fill="#00c8ff">
    <animate attributeName="cx" values="470;830" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="830" cy="150" r="3" fill="#00ff9d">
    <animate attributeName="cx" values="830;470" dur="4s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4s" begin="2s" repeatCount="indefinite"/>
  </circle>

  <!-- inference request card -->
  <g>
    <rect x="470" y="56" width="160" height="54" rx="5" fill="#0d1826" stroke="#152238"/>
    <circle cx="484" cy="68" r="3" fill="#00c8ff"/>
    <text x="494" y="72" class="mono" font-size="9" fill="#7d8590">POST /api/predict</text>
    <rect x="482" y="80" width="90" height="4" rx="2" fill="#152238"/>
    <rect x="482" y="90" width="120" height="4" rx="2" fill="#152238"/>
    <text x="482" y="107" class="mono" font-size="8" fill="#00ff9d" opacity="0">
      200 OK &#183; AUC 0.999
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="4s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- projects list -->
  <g>
    <rect x="650" y="56" width="204" height="54" rx="5" fill="#0d1826" stroke="#152238"/>
    <text x="664" y="72" class="mono" font-size="8" fill="#6b7785" letter-spacing="1">PROJECTS</text>
    <text x="664" y="88" class="mono" font-size="9" fill="#00c8ff" opacity="0">
      DeepTrace &#8212; image forensics
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.3;0.38" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="664" y="88" class="mono" font-size="9" fill="#00c8ff" opacity="0">
      NewsSense AI &#8212; news NLP
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.3;0.38" dur="6s" begin="2s" repeatCount="indefinite"/>
    </text>
    <text x="664" y="88" class="mono" font-size="9" fill="#00c8ff" opacity="0">
      LungCANet &#8212; explainable AI
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.3;0.38" dur="6s" begin="4s" repeatCount="indefinite"/>
    </text>
    <rect x="664" y="96" width="0" height="4" rx="2" fill="#152238">
      <animate attributeName="width" values="0;176;176;0" keyTimes="0;0.7;0.95;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- pipeline checklist -->
  <g>
    <text x="470" y="132" class="mono" font-size="9" fill="#7d8590">&#x2610; ingest data</text>
    <text x="580" y="132" class="mono" font-size="9" fill="#7d8590">&#x2610; train model</text>
    <text x="680" y="132" class="mono" font-size="9" fill="#7d8590">&#x2610; ship API</text>
    <text x="470" y="132" class="mono" font-size="9" fill="#00ff9d" opacity="0">&#x2611; ingest data
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1;0.15;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="580" y="132" class="mono" font-size="9" fill="#00ff9d" opacity="0">&#x2611; train model
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4;0.45;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="680" y="132" class="mono" font-size="9" fill="#00ff9d" opacity="0">&#x2611; ship API
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7;0.75;0.95;1" dur="6s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- blinking cursor -->
  <rect x="856" y="170" width="7" height="12" fill="#00c8ff">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
