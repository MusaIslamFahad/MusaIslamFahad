<svg xmlns="http://www.w3.org/2000/svg" width="720" height="44" viewBox="0 0 720 44" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050a0f"/>
      <stop offset="100%" stop-color="#0a1a2e"/>
    </linearGradient>
  </defs>
  <rect width="720" height="44" fill="url(#bg7)"/>
  <rect x="0" y="0" width="720" height="1" fill="#152238"/>
  <rect x="0" y="43" width="720" height="1" fill="#152238"/>
  <text x="14" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#00c8ff" opacity="0.55">&gt;</text>
  <text x="32" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#c9d1d9">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.24;0.33;1" dur="12s" repeatCount="indefinite"/>
